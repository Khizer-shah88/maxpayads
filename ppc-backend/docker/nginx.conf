events {
    worker_connections 1024;
}

http {
    upstream fastapi {
        server fastapi:8000;
    }

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=click_limit:10m rate=100r/s;

    server {
        listen 80;
        server_name _;

        # Click endpoint — high performance, permissive rate limit
        location /click {
            limit_req zone=click_limit burst=50 nodelay;
            proxy_pass http://fastapi;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 5s;
            proxy_connect_timeout 3s;
        }

        # Ad JS endpoint
        location /ad.js {
            proxy_pass http://fastapi;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header Cache-Control "public, max-age=300";
        }

        # API endpoints
        location / {
            proxy_pass http://fastapi;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check
        location /health {
            proxy_pass http://fastapi;
            access_log off;
        }
    }
}
