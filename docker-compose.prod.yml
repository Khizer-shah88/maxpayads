# ─────────────────────────────────────────────────────────────────────────────
# Max Pay Ads — Production Docker Compose
# Target: 9 slices ≈ 9 vCPU / 18GB RAM — tuned for 4000-5000+ req/s
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── MongoDB ──────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: ppc_mongodb
    volumes:
      - mongodb_data:/data/db
      - mongodb_backup:/backup
    command: >
      mongod
      --wiredTigerCacheSizeGB 5
      --maxConns 1000
      --quiet
      --setParameter diagnosticDataCollectionEnabled=false
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ppc_network
    deploy:
      resources:
        limits:
          memory: 7G
        reservations:
          memory: 3G

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: ppc_redis
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 1500mb
      --maxmemory-policy allkeys-lru
      --save 300 1000
      --tcp-backlog 65535
      --timeout 300
      --tcp-keepalive 60
      --hz 20
      --dynamic-hz yes
      --lazyfree-lazy-eviction yes
      --lazyfree-lazy-expire yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ppc_network
    deploy:
      resources:
        limits:
          memory: 1.8G
        reservations:
          memory: 512M

  # ── RabbitMQ ──────────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-alpine
    container_name: ppc_rabbitmq
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    networks:
      - ppc_network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ── FastAPI backend ───────────────────────────────────────────────────────────
  fastapi:
    build:
      context: ./ppc-backend
      dockerfile: docker/Dockerfile
    container_name: ppc_fastapi
    env_file:
      - ./ppc-backend/.env
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      PYTHONPATH: /app
      SKIP_INIT: "true"
      PORTAL_HOSTNAMES: ${PORTAL_HOSTNAMES:-maxpayads.com,www.maxpayads.com,vertexmonetize.com,www.vertexmonetize.com}
      # Python performance
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./ppc-backend/app/ml/models:/app/app/ml/models
      - ./ppc-backend/uploads:/app/uploads
      - ./ppc-backend/GeoLite2-Country.mmdb:/app/GeoLite2-Country.mmdb:ro
    restart: unless-stopped
    networks:
      - ppc_network
    deploy:
      resources:
        limits:
          memory: 5G
        reservations:
          memory: 2G

  # ── Celery worker ─────────────────────────────────────────────────────────────
  celery_worker:
    build:
      context: ./ppc-backend
      dockerfile: docker/Dockerfile
    container_name: ppc_celery
    command: ["celery", "-A", "app.tasks.celery_app", "worker",
              "--loglevel=warning", "--concurrency=8",
              "--max-tasks-per-child=2000", "--prefetch-multiplier=4"]
    env_file:
      - ./ppc-backend/.env
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      PYTHONPATH: /app
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./ppc-backend/app/ml/models:/app/app/ml/models
      - ./ppc-backend/GeoLite2-Country.mmdb:/app/GeoLite2-Country.mmdb:ro
    restart: unless-stopped
    networks:
      - ppc_network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # ── Celery beat ───────────────────────────────────────────────────────────────
  celery_beat:
    build:
      context: ./ppc-backend
      dockerfile: docker/Dockerfile
    container_name: ppc_celery_beat
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=warning"]
    env_file:
      - ./ppc-backend/.env
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      PYTHONPATH: /app
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ppc_network
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Next.js frontend ──────────────────────────────────────────────────────────
  nextjs:
    build:
      context: ./ppc-frontend
      dockerfile: Dockerfile
      args:
        NEXT_BACKEND_URL: http://fastapi:8000
    container_name: ppc_nextjs
    environment:
      NODE_ENV: production
      NEXT_BACKEND_URL: http://fastapi:8000
      PORTAL_HOSTNAMES: ${PORTAL_HOSTNAMES:-maxpayads.com,www.maxpayads.com,vertexmonetize.com,www.vertexmonetize.com}
      ALLOWED_ENTRY_DOMAINS: ${ALLOWED_ENTRY_DOMAINS:-}
      ENTRY_FALLBACK_URL: ${ENTRY_FALLBACK_URL:-https://www.google.com/}
      ENTRY_SESSION_TTL: ${ENTRY_SESSION_TTL:-900}
      ENTRY_SESSION_SECRET: ${ENTRY_SESSION_SECRET:-}
      ENABLE_SOURCE_DETERRENT: "true"
      SOURCE_DETERRENT_ALLOW_LOCALHOST: "true"
    depends_on:
      - fastapi
    restart: unless-stopped
    networks:
      - ppc_network
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M

  # ── Nginx ─────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: ppc_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/certs/origin.crt:/etc/ssl/certs/origin.crt:ro
      - ./deployment/certs/origin.key:/etc/ssl/private/origin.key:ro
    depends_on:
      - fastapi
      - nextjs
    restart: unless-stopped
    networks:
      - ppc_network
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  mongodb_data:
  mongodb_backup:
  redis_data:
  rabbitmq_data:

networks:
  ppc_network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1500
