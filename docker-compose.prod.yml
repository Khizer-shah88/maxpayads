# ─────────────────────────────────────────────────────────────────────────────
# Max Pay Ads — Production Docker Compose (InterServer VPS)
# Target: 9 slices ≈ 9 vCPU / 18GB RAM / ~270GB SSD (Compose v2 honors deploy.limits)
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Infrastructure ──────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: ppc_mongodb
    volumes:
      - mongodb_data:/data/db
      - mongodb_backup:/backup
    command: >
      mongod
      --wiredTigerCacheSizeGB 2
      --quiet
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ppc_network
    deploy:
      resources:
        limits:
          memory: 3G

  redis:
    image: redis:7.2-alpine
    container_name: ppc_redis
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ppc_network
    deploy:
      resources:
        limits:
          memory: 600M

  rabbitmq:
    image: rabbitmq:3.13-alpine
    container_name: ppc_rabbitmq
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 20s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - ppc_network
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Backend ─────────────────────────────────────────────────────────────────
  fastapi:
    build:
      context: ./ppc-backend
      dockerfile: docker/Dockerfile
    container_name: ppc_fastapi
    env_file:
      - ./ppc-backend/.env
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      PYTHONPATH: /app
      SKIP_INIT: "true"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./ppc-backend/app/ml/models:/app/app/ml/models
      - ./ppc-backend/uploads:/app/uploads
      # MaxMind GeoLite2 country DB (see deployment/README.md — must exist before `up`)
      - ./ppc-backend/GeoLite2-Country.mmdb:/app/GeoLite2-Country.mmdb:ro
    restart: unless-stopped
    networks:
      - ppc_network
    deploy:
      resources:
        limits:
          memory: 1G

  celery_worker:
    build:
      context: ./ppc-backend
      dockerfile: docker/Dockerfile
    container_name: ppc_celery
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    env_file:
      - ./ppc-backend/.env
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      PYTHONPATH: /app
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./ppc-backend/app/ml/models:/app/app/ml/models
      - ./ppc-backend/GeoLite2-Country.mmdb:/app/GeoLite2-Country.mmdb:ro
    restart: unless-stopped
    networks:
      - ppc_network
    deploy:
      resources:
        limits:
          memory: 1G

  celery_beat:
    build:
      context: ./ppc-backend
      dockerfile: docker/Dockerfile
    container_name: ppc_celery_beat
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=info"]
    env_file:
      - ./ppc-backend/.env
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      PYTHONPATH: /app
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ppc_network
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Frontend ────────────────────────────────────────────────────────────────
  nextjs:
    build:
      context: ./ppc-frontend
      dockerfile: Dockerfile
      args:
        NEXT_BACKEND_URL: http://fastapi:8000
    container_name: ppc_nextjs
    environment:
      NODE_ENV: production
      NEXT_BACKEND_URL: http://fastapi:8000
      # Hostnames allowed to serve the portal (landing page, admin, publisher).
      # Every other hostname (redirection domains etc.) gets 404 for portal
      # pages while /d/[slug], /api/* and static assets keep working.
      PORTAL_HOSTNAMES: ${PORTAL_HOSTNAMES:-maxpayads.com,www.maxpayads.com,vertexmonetize.com,www.vertexmonetize.com}
      # Entry guard — values are injected from deployment/.env.production
      # via the ALLOWED_ENTRY_DOMAINS / ENTRY_* variables set in that file.
      ALLOWED_ENTRY_DOMAINS: ${ALLOWED_ENTRY_DOMAINS:-}
      ENTRY_FALLBACK_URL: ${ENTRY_FALLBACK_URL:-https://www.google.com/}
      ENTRY_SESSION_TTL: ${ENTRY_SESSION_TTL:-900}
      ENTRY_SESSION_SECRET: ${ENTRY_SESSION_SECRET:-}
      # Source-view deterrent kill switch. STOOD DOWN (false) -- the worker
      # reload-looped visitors on any page without the heartbeat script, above
      # all the session-unavailable 403 page. Read at request time, so a flip
      # needs only `docker compose up -d nextjs`, no rebuild. Do NOT set this
      # to "true" until the acceptance tests in SOURCE_DETERRENT.md pass in a
      # real browser on a real prelander domain.
      ENABLE_SOURCE_DETERRENT: ${ENABLE_SOURCE_DETERRENT:-false}
    depends_on:
      - fastapi
    restart: unless-stopped
    networks:
      - ppc_network
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Nginx + SSL ─────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: ppc_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      # Cloudflare Origin certificate (see deployment/certs/README.md)
      - ./deployment/certs/origin.crt:/etc/ssl/certs/origin.crt:ro
      - ./deployment/certs/origin.key:/etc/ssl/private/origin.key:ro
    depends_on:
      - fastapi
      - nextjs
    restart: unless-stopped
    networks:
      - ppc_network

volumes:
  mongodb_data:
  mongodb_backup:
  redis_data:
  rabbitmq_data:

networks:
  ppc_network:
    driver: bridge
