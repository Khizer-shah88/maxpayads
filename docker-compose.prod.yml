# ─────────────────────────────────────────────────────────────────────────────
# Max Pay Ads — Production Docker Compose
# Starting budget for 9 vCPU / 18GB RAM. Capacity must be load-tested.
# ─────────────────────────────────────────────────────────────────────────────

x-runtime: &runtime
  ulimits:
    nofile:
      soft: 65536
      hard: 65536
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ── MongoDB ──────────────────────────────────────────────────────────────────
  mongodb:
    <<: *runtime
    image: mongo:7.0
    container_name: ppc_mongodb
    volumes:
      - mongodb_data:/data/db
      - mongodb_backup:/backup
    command: >
      mongod
      --wiredTigerCacheSizeGB 3
      --maxConns 2000
      --quiet
      --setParameter diagnosticDataCollectionEnabled=false
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ppc_network
    deploy:
      resources:
        limits:
          memory: 5G
        reservations:
          memory: 3G

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    <<: *runtime
    image: redis:7.2-alpine
    container_name: ppc_redis
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 300 1000
      --tcp-backlog 65535
      --timeout 300
      --tcp-keepalive 60
      --hz 20
      --dynamic-hz yes
      --lazyfree-lazy-eviction yes
      --lazyfree-lazy-expire yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ppc_network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ── RabbitMQ ──────────────────────────────────────────────────────────────────
  rabbitmq:
    <<: *runtime
    image: rabbitmq:3.13-alpine
    container_name: ppc_rabbitmq
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit vm_memory_high_watermark 0.5"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    networks:
      - ppc_network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ── FastAPI backend ───────────────────────────────────────────────────────────
  fastapi:
    <<: *runtime
    build:
      context: ./ppc-backend
      dockerfile: docker/Dockerfile
    container_name: ppc_fastapi
    env_file:
      - ./ppc-backend/.env
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      PYTHONPATH: /app
      SKIP_INIT: "true"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-8}
      MONGO_MAX_POOL_SIZE: ${MONGO_MAX_POOL_SIZE:-40}
      MONGO_MIN_POOL_SIZE: ${MONGO_MIN_POOL_SIZE:-2}
      API_MAX_INFLIGHT: ${API_MAX_INFLIGHT:-512}
      REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-128}
      # Only internal Docker peers can supply nginx's normalized visitor IP.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,127.0.0.1/32}
      # The API has no published port; only nginx/Next.js reach it on this network.
      FORWARDED_ALLOW_IPS: "*"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PORTAL_HOSTNAMES: ${PORTAL_HOSTNAMES:-maxpayads.com,www.maxpayads.com,vertexmonetize.com,www.vertexmonetize.com}
      # Python performance
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./ppc-backend/app/ml/models:/app/app/ml/models
      - ./ppc-backend/uploads:/app/uploads
      - ./ppc-backend/GeoLite2-Country.mmdb:/app/GeoLite2-Country.mmdb:ro
    restart: unless-stopped
    networks:
      - ppc_network
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 2G

  # ── Celery worker ─────────────────────────────────────────────────────────────
  celery_worker:
    <<: *runtime
    build:
      context: ./ppc-backend
      dockerfile: docker/Dockerfile
    container_name: ppc_celery
    command: ["celery", "-A", "app.tasks.celery_app", "worker",
              "--loglevel=warning", "--concurrency=6",
              "--max-tasks-per-child=2000", "--prefetch-multiplier=1"]
    env_file:
      - ./ppc-backend/.env
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      PYTHONPATH: /app
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./ppc-backend/app/ml/models:/app/app/ml/models
      - ./ppc-backend/GeoLite2-Country.mmdb:/app/GeoLite2-Country.mmdb:ro
    restart: unless-stopped
    networks:
      - ppc_network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # ── Celery beat ───────────────────────────────────────────────────────────────
  celery_beat:
    <<: *runtime
    build:
      context: ./ppc-backend
      dockerfile: docker/Dockerfile
    container_name: ppc_celery_beat
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=warning"]
    env_file:
      - ./ppc-backend/.env
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      PYTHONPATH: /app
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ppc_network
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Next.js frontend ──────────────────────────────────────────────────────────
  nextjs:
    <<: *runtime
    build:
      context: ./ppc-frontend
      dockerfile: Dockerfile
      args:
        NEXT_BACKEND_URL: http://fastapi:8000
    container_name: ppc_nextjs
    environment:
      NODE_ENV: production
      NEXT_WORKERS: ${NEXT_WORKERS:-2}
      NODE_OPTIONS: --max-old-space-size=640
      NEXT_BACKEND_URL: http://fastapi:8000
      PORTAL_HOSTNAMES: ${PORTAL_HOSTNAMES:-maxpayads.com,www.maxpayads.com,vertexmonetize.com,www.vertexmonetize.com}
      ALLOWED_ENTRY_DOMAINS: ${ALLOWED_ENTRY_DOMAINS:-}
      ENTRY_FALLBACK_URL: ${ENTRY_FALLBACK_URL:-https://www.google.com/}
      ENTRY_SESSION_TTL: ${ENTRY_SESSION_TTL:-900}
      ENTRY_SESSION_SECRET: ${ENTRY_SESSION_SECRET:-}
      ENABLE_SOURCE_DETERRENT: "true"
      SOURCE_DETERRENT_ALLOW_LOCALHOST: "true"
    depends_on:
      - fastapi
    restart: unless-stopped
    networks:
      - ppc_network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ── Nginx ─────────────────────────────────────────────────────────────────────
  nginx:
    <<: *runtime
    image: nginx:alpine
    container_name: ppc_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/certs/origin.crt:/etc/ssl/certs/origin.crt:ro
      - ./deployment/certs/origin.key:/etc/ssl/private/origin.key:ro
    depends_on:
      - fastapi
      - nextjs
    restart: unless-stopped
    networks:
      - ppc_network
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  mongodb_data:
  mongodb_backup:
  redis_data:
  rabbitmq_data:

networks:
  ppc_network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1500
