events {
    worker_connections 2048;
}

http {
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=click_zone:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=100r/s;

    # Docker DNS resolver for service-name upstreams
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_host $fastapi_upstream {
        default fastapi:8000;
    }

    map $http_host $nextjs_upstream {
        default nextjs:3000;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;
    gzip_vary on;

    # Map for CF-Connecting-IP forwarding
    map $http_cf_connecting_ip $real_ip {
        default $http_cf_connecting_ip;
        ""      $remote_addr;
    }

    # ═══════════════════════════════════════════════════════════════════════
    # maxpayads.com — Admin + Publisher frontend
    # ═══════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        listen 443 ssl;
        http2 on;
        server_name maxpayads.com www.maxpayads.com vertexmonetize.com www.vertexmonetize.com;

        ssl_certificate /etc/ssl/certs/origin.crt;
        ssl_certificate_key /etc/ssl/private/origin.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 200M;

        # API routes → FastAPI (bypasses Next.js rewrite for performance)
        location ~ ^/api/(auth|admin|publisher|campaigns|clicks|withdrawals|analytics|offers|landing-pages|prelander|prelander-templates|redirection-domains|direct-links|uploads)(/|$) {
            limit_req zone=api_zone burst=200 nodelay;
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://$fastapi_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_read_timeout 30s;
        }

        # Health check
        location = /health {
            proxy_pass http://$fastapi_upstream;
            access_log off;
        }

        # API docs
        location ~ ^/(docs|redoc|openapi.json) {
            proxy_pass http://$fastapi_upstream;
            proxy_set_header Host $host;
        }

        # Next.js static assets
        location /_next/static/ {
            proxy_pass http://$nextjs_upstream;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Everything else → Next.js
        location / {
            limit_req zone=api_zone burst=200 nodelay;
            proxy_pass http://$nextjs_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_http_version 1.1;
            proxy_read_timeout 60s;
        }
    }

    # ═══════════════════════════════════════════════════════════════════════
    # browsmac.org — Anchor/redirect domain (publisher sites link here)
    # ═══════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        listen 443 ssl;
        http2 on;
        server_name browsmac.org www.browsmac.org;

        ssl_certificate /etc/ssl/certs/origin.crt;
        ssl_certificate_key /etc/ssl/private/origin.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Ad JS served from here (hides tracking domain from publisher embed codes)
        location = /ad.js {
            proxy_pass http://fastapi;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header Cache-Control "public, max-age=300";
            add_header Access-Control-Allow-Origin "*";
        }

        # /click — Smartlink entry point (traffic router → chain anchor /d/{slug})
        location = /click {
            limit_req zone=click_zone burst=100 nodelay;
            proxy_pass http://fastapi;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 5s;
            proxy_connect_timeout 3s;
            proxy_buffering off;
        }

        # Prelander API → FastAPI (chain middleware + domain-type/resolve JSON
        # for the /d/[slug] page served on this domain)
        location ~ ^/api/prelander(/|$) {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://fastapi;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_headers on;
        }

        # /d/ on the Anchor — the Redirect Chain entry hop. The chain
        # middleware sets the session cookie here and 302s to the Inter
        # domain's /d/{slug}. Without this location the anchor 404s and the
        # admin-built chain never starts.
        location /d/ {
            proxy_pass http://fastapi;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_headers on;
        }

        # Next.js static assets for the /d/ page (when served from this domain)
        location /_next/static/ {
            proxy_pass http://nextjs;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            # Only redirect if pub= parameter is present (real click flow)
            if ($arg_pub) {
                return 302 https://clickspot.icu/go?$args&ref=$http_referer;
            }
            # Direct visits without pub param → Page Not Found
            return 404;
        }
    }

    # ═══════════════════════════════════════════════════════════════════════
    # clickspot.icu — Click tracking domain
    # ═══════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        listen 443 ssl;
        http2 on;
        server_name clickspot.icu www.clickspot.icu;

        ssl_certificate /etc/ssl/certs/origin.crt;
        ssl_certificate_key /etc/ssl/private/origin.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Click endpoint — max performance
        location = /click {
            limit_req zone=click_zone burst=100 nodelay;
            proxy_pass http://fastapi;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_read_timeout 5s;
            proxy_connect_timeout 3s;
            proxy_buffering off;
        }

        # Obfuscated click endpoint (same as /click)
        location = /go {
            limit_req zone=click_zone burst=100 nodelay;
            rewrite ^/go$ /click break;
            proxy_pass http://fastapi;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_read_timeout 5s;
            proxy_connect_timeout 3s;
            proxy_buffering off;
        }

        # Ad JS
        location = /ad.js {
            proxy_pass http://fastapi;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header Cache-Control "public, max-age=300";
            add_header Access-Control-Allow-Origin "*";
        }

        location / {
            return 404;
        }
    }

    # ═══════════════════════════════════════════════════════════════════════
    # clickfilesetup.info — Windows Prelander
    # ═══════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        listen 443 ssl;
        http2 on;
        server_name clickfilesetup.info www.clickfilesetup.info;

        ssl_certificate /etc/ssl/certs/origin.crt;
        ssl_certificate_key /etc/ssl/private/origin.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # API route for prelander data fetch
        location ~ ^/api/(prelander)(/|$) {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://fastapi;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Next.js static assets
        location /_next/static/ {
            proxy_pass http://nextjs;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Next.js chunks and other _next assets
        location /_next/ {
            proxy_pass http://nextjs;
            proxy_set_header Host $host;
        }

        # Slug-based prelander route — /d/{slug} handled by Next.js dynamic route
        location /d/ {
            proxy_pass http://nextjs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_http_version 1.1;
        }

        # Public static files (videos, images)
        location ~ \.(mp4|webm|png|jpg|jpeg|gif|ico|svg)$ {
            proxy_pass http://nextjs;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=86400";
        }

        # Everything else → 404
        location / {
            return 404;
        }
    }

    # ═══════════════════════════════════════════════════════════════════════
    # rydestudio.info — Mac Prelander
    # ═══════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        listen 443 ssl;
        http2 on;
        server_name rydestudio.info www.rydestudio.info;

        ssl_certificate /etc/ssl/certs/origin.crt;
        ssl_certificate_key /etc/ssl/private/origin.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # API route for prelander data fetch
        location ~ ^/api/(prelander)(/|$) {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://fastapi;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Next.js static assets
        location /_next/static/ {
            proxy_pass http://nextjs;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Next.js chunks and other _next assets
        location /_next/ {
            proxy_pass http://nextjs;
            proxy_set_header Host $host;
        }

        # Slug-based prelander route — /d/{slug} handled by Next.js dynamic route
        location /d/ {
            proxy_pass http://nextjs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_http_version 1.1;
        }

        # Public static files (videos, images)
        location ~ \.(mp4|webm|png|jpg|jpeg|gif|ico|svg)$ {
            proxy_pass http://nextjs;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=86400";
        }

        # Everything else → 404
        location / {
            return 404;
        }
    }

    # ═══════════════════════════════════════════════════════════════════════
    # Default catch-all (direct IP access / any unlisted domain)
    # Any domain added in Admin → Redirection Domains will be served here.
    # ═══════════════════════════════════════════════════════════════════════
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate /etc/ssl/certs/origin.crt;
        ssl_certificate_key /etc/ssl/private/origin.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 200M;

        # Admin/Publisher API routes → FastAPI directly
        location ~ ^/api/(auth|admin|publisher|campaigns|clicks|withdrawals|analytics|offers|landing-pages|prelander-templates|redirection-domains|direct-links|uploads)(/|$) {
            limit_req zone=api_zone burst=200 nodelay;
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://fastapi;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Prelander API → FastAPI directly (must NOT go through Next.js proxy
        # because Next.js swallows the 302 redirect from the intermediate hop)
        location ~ ^/api/prelander(/|$) {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://fastapi;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Forward custom headers used for intermediate domain detection
            proxy_pass_request_headers on;
        }

        location = /click {
            limit_req zone=click_zone burst=100 nodelay;
            proxy_pass http://fastapi;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 5s;
            proxy_connect_timeout 3s;
            proxy_buffering off;
        }

        location = /ad.js {
            proxy_pass http://fastapi;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=300";
            add_header Access-Control-Allow-Origin "*";
        }

        location = /health {
            proxy_pass http://fastapi;
            access_log off;
        }

        location ~ ^/(docs|redoc|openapi.json) {
            proxy_pass http://fastapi;
            proxy_set_header Host $host;
        }

        location /_next/static/ {
            proxy_pass http://nextjs;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Public static files (video tutorials on prelander domains)
        location ~ \.(mp4|webm|png|jpg|jpeg|gif|ico|svg)$ {
            proxy_pass http://nextjs;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=86400";
        }

        location / {
            limit_req zone=api_zone burst=200 nodelay;
            proxy_pass http://nextjs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_http_version 1.1;
            proxy_read_timeout 60s;
        }
    }
}
