# Production proxy; throughput is measured with deployment/load-test.py.
# Server: 9 vCPU / 18GB RAM

worker_processes auto;            # 1 process per vCPU = 9 workers
worker_rlimit_nofile 65536;

events {
    worker_connections  8192;     # 9 workers × 8192 = 73728 simultaneous conns
    use epoll;
    multi_accept on;
    accept_mutex off;             # better throughput on multi-core
}

http {
    # ── Basics ────────────────────────────────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    server_tokens       off;
    keepalive_timeout   65;
    keepalive_requests  10000;    # reuse connections heavily

    # File descriptor cache — avoid stat() on every static file request
    open_file_cache          max=10000 inactive=20s;
    open_file_cache_valid    30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    # ── Buffer tuning ─────────────────────────────────────────────────────────
    client_body_buffer_size     128k;
    client_header_buffer_size   4k;
    large_client_header_buffers 4 16k;
    client_max_body_size        200M;
    client_body_timeout         30s;
    client_header_timeout       10s;
    send_timeout                30s;

    # ── Proxy buffer tuning ───────────────────────────────────────────────────
    proxy_buffer_size           16k;
    proxy_buffers               8 32k;
    proxy_busy_buffers_size     64k;
    proxy_temp_file_write_size  64k;
    proxy_connect_timeout       5s;
    proxy_send_timeout          30s;
    proxy_read_timeout          30s;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip             on;
    gzip_comp_level  2;           # level 2: fast compression, still good ratio
    gzip_min_length  1000;
    gzip_proxied     any;
    gzip_types
        text/plain text/css application/json application/javascript
        text/xml application/xml text/javascript image/svg+xml;
    gzip_vary        on;

    # ── Rate limiting zones ───────────────────────────────────────────────────
    # click_zone: 100 r/s per IP (ad traffic — allow bursts)
    limit_req_zone $binary_remote_addr zone=click_zone:20m rate=100r/s;
    # api_zone: 500 r/s per IP (admin/api traffic)
    limit_req_zone $binary_remote_addr zone=api_zone:20m  rate=500r/s;
    # Suppress rate-limit log spam
    limit_req_log_level warn;
    limit_req_status 429;

    # ── Docker internal DNS ───────────────────────────────────────────────────
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ── Real IP from Cloudflare ───────────────────────────────────────────────
    # Trust Cloudflare headers only from Cloudflare's published networks.
    # https://www.cloudflare.com/ips-v4/ and /ips-v6/ (checked 2026-09-28).
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # ── Upstream: FastAPI backend ─────────────────────────────────────────────
    # keepalive: hold 256 persistent connections per nginx worker to FastAPI.
    # Without this nginx opens a NEW TCP connection for every proxied request
    # — at 4000 req/s that is 4000 TCP handshakes per second, which is the
    # main reason the stack crashed at 180 requests.
    upstream fastapi_backend {
        server fastapi:8000;
        keepalive 32;             # idle connections PER nginx worker
        keepalive_requests 5000;
        keepalive_timeout  60s;
    }

    upstream nextjs_frontend {
        server nextjs:3000;
        keepalive 16;
        keepalive_requests 2000;
        keepalive_timeout  60s;
    }

    # ── Main server ───────────────────────────────────────────────────────────
    server {
        listen 80  default_server reuseport backlog=65535;
        listen 443 ssl default_server reuseport backlog=65535;
        http2 on;
        server_name _;

        ssl_certificate     /etc/ssl/certs/origin.crt;
        ssl_certificate_key /etc/ssl/private/origin.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:50m;   # shared across workers
        ssl_session_timeout 1d;
        ssl_buffer_size     4k;

        # ── Domain access control ─────────────────────────────────────────────
        auth_request /_domain_check;
        auth_request_set $domain_known $upstream_http_x_domain_known;
        error_page 403 = @domain_denied;
        # 404 (a real response) instead of 444: nginx 444 closes the
        # connection with ZERO bytes, and Cloudflare in front of this origin
        # reports that as "Error 520 — web server is returning an unknown
        # error" on every disallowed path (bare Inter-domain root visits,
        # expired roles, direct page loads). A plain empty 404 is equally
        # information-free for scrapers but renders as a normal 404.
        location @domain_denied {
            default_type text/plain;
            if ($domain_known = 0) {
                return 444;
            }
            return 404;
        }

        location = /_domain_check {
            internal;
            auth_request off;
            proxy_pass              http://fastapi_backend/domain-access;
            proxy_pass_request_body off;
            proxy_set_header        Content-Length "";
            proxy_set_header        Host $host;
            proxy_set_header        X-Original-URI $request_uri;
            # Critical: reuse the keepalive pool for auth subrequests too
            proxy_http_version      1.1;
            proxy_set_header        Connection "";
            proxy_read_timeout 5s;
            # NOTE: no proxy_intercept_errors here. The auth_request module
            # only accepts 2xx/401/403 from the subrequest — anything else is
            # answered to the visitor as nginx's own 500 (Cloudflare Error
            # 520). The backend's /domain-access therefore answers every
            # failure mode with a REAL status: 2xx allow, 403 deny (including
            # store hiccups — the middleware fail-closes with 403), so the
            # 403 → @domain_denied → 404 path above always ends in a normal
            # error page instead of a connection close.
        }

        # ── Common proxy headers ──────────────────────────────────────────────
        proxy_http_version 1.1;
        proxy_set_header   Connection      "";   # required for keepalive upstream
        proxy_set_header   Host            $host;
        proxy_set_header   X-Forwarded-Host $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $remote_addr;
        proxy_set_header   CF-Connecting-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # ── Health check — bypasses domain validation ─────────────────────────
        location = /health {
            auth_request off;
            proxy_pass   http://fastapi_backend;
            access_log   off;
        }

        # ── Static assets — serve with long cache, skip auth ─────────────────
        location /_next/static/ {
            auth_request off;
            proxy_pass   http://nextjs_frontend;
            add_header   Cache-Control "public, max-age=31536000, immutable";
            access_log   off;
        }

        # ── API routes ────────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_zone burst=1000 nodelay;
            rewrite   ^/api/(.*) /$1 break;
            proxy_pass http://fastapi_backend;
            proxy_read_timeout 30s;
        }

        # ── Click endpoint — highest throughput path ──────────────────────────
        location = /click {
            limit_req   zone=click_zone burst=500 nodelay;
            proxy_pass  http://fastapi_backend;
            proxy_read_timeout 10s;
            proxy_buffering off;        # low latency for redirects
        }

        location = /go {
            rewrite ^/go$ /click break;
            proxy_pass http://fastapi_backend;
            proxy_buffering off;
        }

        # ── Ad JS ─────────────────────────────────────────────────────────────
        location = /ad.js {
            proxy_pass http://fastapi_backend;
            add_header Cache-Control "no-store" always;
            add_header Access-Control-Allow-Origin "*";
        }

        # ── Prelander auth ────────────────────────────────────────────────────
        location /_auth/ {
            rewrite ^/_auth/(.*) /prelander/_auth/$1 break;
            proxy_pass http://fastapi_backend;
            add_header Cache-Control "no-store" always;
        }

        # ── Docs ──────────────────────────────────────────────────────────────
        location ~ ^/(docs|redoc|openapi\.json) {
            auth_request off;
            proxy_pass http://fastapi_backend;
        }

        # ── Source deterrent service workers ─────────────────────────────────
        location ~ ^/(source-deterrent-sw|unregister-source-deterrent)\.js$ {
            proxy_pass http://nextjs_frontend;
            add_header Cache-Control "no-store" always;
        }

        # ── Everything else → Next.js ─────────────────────────────────────────
        location / {
            limit_req      zone=api_zone burst=1000 nodelay;
            proxy_pass     http://nextjs_frontend;
            proxy_read_timeout 60s;
        }
    }
}
