events {
    worker_connections 2048;
}

http {
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=click_zone:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=100r/s;

    # Docker DNS resolver for service-name upstreams
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_host $fastapi_upstream {
        default fastapi:8000;
    }

    map $http_host $nextjs_upstream {
        default nextjs:3000;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;
    gzip_vary on;

    # Map for CF-Connecting-IP forwarding
    map $http_cf_connecting_ip $real_ip {
        default $http_cf_connecting_ip;
        ""      $remote_addr;
    }

    # All hostnames use the admin-managed role policy; no hardcoded chains.
    server {
        listen 80 default_server;
        server_name _;
        client_max_body_size 200M;

        auth_request /_domain_check;
        error_page 403 = @domain_denied;
        location @domain_denied { return 444; }
        location = /_domain_check {
            internal;
            auth_request off;
            proxy_pass http://$fastapi_upstream/domain-access;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            proxy_set_header X-Original-URI $request_uri;
        }

        # Overwrite forwarded host headers at the trusted proxy boundary.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /api/ {
            limit_req zone=api_zone burst=200 nodelay;
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://$fastapi_upstream;
            proxy_read_timeout 30s;
        }
        location = /click {
            limit_req zone=click_zone burst=100 nodelay;
            proxy_pass http://$fastapi_upstream;
            proxy_read_timeout 10s;
            proxy_buffering off;
        }
        location = /go {
            rewrite ^/go$ /click break;
            proxy_pass http://$fastapi_upstream;
        }
        location = /ad.js {
            proxy_pass http://$fastapi_upstream;
            add_header Cache-Control "no-store" always;
            add_header Access-Control-Allow-Origin "*";
        }
        location /_auth/ {
            rewrite ^/_auth/(.*) /prelander/_auth/$1 break;
            proxy_pass http://$fastapi_upstream;
            add_header Cache-Control "no-store" always;
        }
        location = /health {
            proxy_pass http://$fastapi_upstream;
            access_log off;
        }
        location ~ ^/(docs|redoc|openapi.json) {
            proxy_pass http://$fastapi_upstream;
        }
        location /_next/static/ {
            proxy_pass http://$nextjs_upstream;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location ~ ^/(source-deterrent-sw|unregister-source-deterrent)\.js$ {
            proxy_pass http://$nextjs_upstream;
            add_header Cache-Control "no-store" always;
        }
        location / {
            limit_req zone=api_zone burst=200 nodelay;
            proxy_pass http://$nextjs_upstream;
            proxy_http_version 1.1;
            proxy_read_timeout 60s;
        }
    }
}
