events {
    worker_connections 1024;
}

http {
    # Rate limiting for click endpoint
    limit_req_zone $binary_remote_addr zone=click_zone:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=100r/s;

    # Docker DNS resolver for service-name upstreams
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_host $fastapi_upstream {
        default fastapi:8000;
    }

    map $http_host $nextjs_upstream {
        default nextjs:3000;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    server {
        listen 80;
        server_name _;
        client_max_body_size 10M;

        # ── Click endpoint — direct to FastAPI, max performance ──────────────
        location = /click {
            limit_req zone=click_zone burst=100 nodelay;
            proxy_pass http://$fastapi_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 5s;
            proxy_connect_timeout 3s;
            proxy_buffering off;
        }

        # ── Ad JS — direct to FastAPI, short cache ───────────────────────────
        location = /ad.js {
            proxy_pass http://$fastapi_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header Cache-Control "public, max-age=300";
        }

        # ── FastAPI health check ─────────────────────────────────────────────
        location = /health {
            proxy_pass http://$fastapi_upstream;
            access_log off;
        }

        # ── FastAPI docs (direct access) ─────────────────────────────────────
        location ~ ^/(docs|redoc|openapi.json) {
            proxy_pass http://$fastapi_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Next.js static assets (high performance) ─────────────────────────
        location /_next/static/ {
            proxy_pass http://$nextjs_upstream;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # ── Everything else → Next.js ─────────────────────────────────────────
        # This includes /api/* which Next.js rewrites to FastAPI internally
        location / {
            limit_req zone=api_zone burst=200 nodelay;
            proxy_pass http://$nextjs_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_http_version 1.1;
            proxy_read_timeout 60s;
        }
    }
}
