      - name: Verify SSH secret is available
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "ERROR: SERVER_SSH_KEY is empty or unavailable"
            exit 1
          fi

          echo "SERVER_SSH_KEY is available"
          echo "SSH key length: ${#SSH_KEY} characters"

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}


          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Trust server host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Verify server access
        run: |
          ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "echo 'SSH connection OK'; test -d '${APP_DIR}' && echo 'APP_DIR exists'"

      - name: Sync repository to server
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude 'ppc-backend/.env' \
            --exclude 'ppc-backend/uploads/' \
            --exclude 'ppc-backend/GeoLite2-Country.mmdb' \
            --exclude 'deployment/.env.production' \
            --exclude 'deployment/certs/origin.crt' \
            --exclude 'deployment/certs/origin.key' \
            ./ "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${APP_DIR}/"

      - name: Deploy on server
        run: |
          ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "cd '${APP_DIR}' && bash deployment/2-deploy.sh"