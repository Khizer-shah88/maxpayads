name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'ppc-frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ppc-frontend/**'
      - '.github/workflows/frontend-ci.yml'

# Cancel in-progress runs when a new push happens
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: ppc-frontend

    env:
      NEXT_BACKEND_URL: http://localhost:8000
      # Entry guard — disabled in CI (blank secret disables the guard)
      ALLOWED_ENTRY_DOMAINS: ""
      ENTRY_FALLBACK_URL: https://www.google.com/
      ENTRY_SESSION_TTL: "900"
      ENTRY_SESSION_SECRET: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ppc-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Admin routing and login regression tests
        run: node --test tests/admin-auth.test.cjs

      - name: Build
        run: npm run build

      - name: Prelander rendering and session regression tests
        env:
          PRELANDER_TEST_BUILD: '1'
          ENABLE_SOURCE_DETERRENT: 'true'
        run: node --test tests/prelander-session.test.cjs tests/source-deterrent.test.cjs
