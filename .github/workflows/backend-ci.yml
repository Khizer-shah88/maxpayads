name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'ppc-backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ppc-backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ppc-backend

    env:
      APP_NAME: Max Pay Ads
      APP_VERSION: 1.0.0
      DEBUG: 'false'
      SECRET_KEY: ci-test-secret-key-ci-test-secret-key
      MONGODB_URL: mongodb://127.0.0.1:27017
      REDIS_URL: redis://127.0.0.1:6379
      # Use the GitHub Actions service host name for RabbitMQ
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: changeme123
      ADMIN_NAME: CI Admin
      GEOIP_DB_PATH: ./GeoLite2-Country.mmdb
      CORS_ORIGINS: http://localhost:3000

    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics --host localhost status"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ppc-backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q
